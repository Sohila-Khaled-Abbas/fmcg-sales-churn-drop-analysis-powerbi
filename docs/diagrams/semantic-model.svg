<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="t d">
<title id="t">Power BI semantic model fact constellation</title>
<desc id="d">Four fact tables connected to six dimensions. Dim Date is shared across facts, with an inactive delivered-date relationship to Fact Order.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b0d0f"/><stop offset="1" stop-color="#151c23"/></linearGradient>
 <marker id="arr" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#64748b"/></marker>
</defs>
<rect width="1440" height="900" rx="28" fill="url(#bg)"/>
<rect x="60" y="54" width="1320" height="3" rx="2" fill="#f5a623"/>
<text x="72" y="112" fill="#f8fafc" font-family="Arial,sans-serif" font-size="34" font-weight="700" letter-spacing="1">SEMANTIC MODEL · FACT CONSTELLATION</text>
<text x="74" y="148" fill="#8b98a8" font-family="Arial,sans-serif" font-size="17">Shared dimensions connect four analytical facts; relationship paths mirror the current TMDL definitions</text>
